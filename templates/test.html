<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Switch Toggle Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the toggle buttons */
        .toggle-group input[type="radio"] {
            display: none;
        }

        .toggle-group label {
            cursor: pointer;
            padding: 0.5rem 1rem;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .toggle-group label:hover {
            background-color: #e2e8f0; /* Hover effect */
        }

        .toggle-group input[type="radio"]:checked + label {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .toggle-group {
            display: flex;
        }

        .toggle-group label:first-child {
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
        }

        .toggle-group label:last-child {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
    <div class="toggle-group">
        <input type="radio" id="optionH" name="toggle" checked>
        <label for="optionH" class="bg-gray-200 border-r border-gray-300 text-lg font-bold">H</label>

        <input type="radio" id="optionA" name="toggle">
        <label for="optionA" class="bg-gray-200 text-lg font-bold">A</label>
    </div>
</body>
</html>
