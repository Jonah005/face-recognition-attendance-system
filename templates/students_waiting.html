<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Waiting</title>
</head>
<body>
    <h2>Enter Numerical Code</h2>
    <form action="{{ url_for('students_waiting') }}" method="post">
        <label for="numerical_code">Numerical Code:</label>
        <input type="text" id="numerical_code" name="numerical_code" required>
        <input type="submit" value="Submit">
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</body>
</html>
